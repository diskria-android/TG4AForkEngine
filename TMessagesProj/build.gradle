            ndk.debugSymbolLevel = 'NONE' // forky code line
        }
    }
    // forky code start
    variantFilter { variant ->
        def distributionType = variant.flavors.find { it.dimension == "distributionType" }?.name
        def artifactType = variant.flavors.find { it.dimension == "artifactType" }?.name
        def isGoogle = distributionType == "google"
        def isBundle = artifactType.startsWith("bundle")
        if (isBundle && !isGoogle) {
            variant.setIgnore(true)
        } else if (variant.buildType.name != "release" && isBundle) {
            variant.setIgnore(true)
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "app.apk"
        }
