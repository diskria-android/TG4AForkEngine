def getProps(String propName /* forky code start */ , boolean required = true /* forky code end */) {
    // forky code start
    def isCI = System.getenv("CI") != null && !System.getenv("CI").isEmpty()
    if (isCI) {
        def ciProp = System.getenv(propName)
        if (ciProp != null && !ciProp.isEmpty()) {
            return ciProp
        }
        if (required) {
            throw new GradleException("Missing required CI environment variable: ${propName}")
        }
    }
    if (project.hasProperty(propName)) {
        return project.property(propName)
    }
    // forky code end
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        /* forky comment return */ /* forky code start */ def localProp = /* forky code end */ props[propName]
        // forky code start
        if (localProp != null && !localProp.isEmpty()) {
            return localProp
        }
        if (required) {
            throw new GradleException("Property '${propName}' not found in local.properties")
        }
        return ""
        // forky code end
    } else {
        // forky code start
        if (required) {
            throw new GradleException("local.properties file is missing and not on CI!")
        }
        // forky code end
        return "";
    }
}
