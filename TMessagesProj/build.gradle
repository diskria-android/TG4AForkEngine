// forky comment line def isWindows = String.valueOf(DefaultNativePlatform.currentOperatingSystem.toFamilyName() == OperatingSystemFamily.WINDOWS)
android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
        checkReleaseBuilds false // forky code line
    }

    compileOptions {
        /* forky comment
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        */
        // forky code start
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        // forky code end
        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
        // forky code start
        versionName APP_VERSION_NAME

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
        buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", String.valueOf(DefaultNativePlatform.currentOperatingSystem.toFamilyName() == OperatingSystemFamily.WINDOWS)

        buildConfigField "String", "APP_CENTER_HASH", "\"\""
        buildConfigField "String", "BETA_URL", "\"\""
        buildConfigField "boolean", "DEBUG_VERSION", "true"
        buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
        buildConfigField "boolean", "BUNDLE", "false"
        buildConfigField "int", "VERSION_NUM", "0"

        manifestPlaceholders = [
                "applicationLabel": "@string/AppName",

                "defaultIcon"     : "@mipmap/ic_launcher",
                "defaultRoundIcon": "@mipmap/ic_launcher_round",

                "vintageIcon"     : "@mipmap/icon_6_launcher",
                "vintageRoundIcon": "@mipmap/icon_6_launcher_round",

                "aquaIcon"        : "@mipmap/icon_4_launcher",
                "aquaRoundIcon"   : "@mipmap/icon_4_launcher_round",

                "premiumIcon"     : "@mipmap/icon_3_launcher",
                "premiumRoundIcon": "@mipmap/icon_3_launcher_round",

                "turboIcon"       : "@mipmap/icon_5_launcher",
                "turboRoundIcon"  : "@mipmap/icon_5_launcher_round",

                "noxIcon"         : "@mipmap/icon_2_launcher",
                "noxRoundIcon"    : "@mipmap/icon_2_launcher_round",
        ]
        // forky code end
    }

    // forky code start
    flavorDimensions "distributionType", "artifactType"

    productFlavors {
        google {
            dimension "distributionType"
            buildConfigField "int", "VERSION_NUM", "7"
            manifestPlaceholders += ["applicationName": "org.telegram.messenger.google.ApplicationLoaderImpl"]
        }
        huawei {
            dimension "distributionType"
            buildConfigField "int", "VERSION_NUM", "7"
            manifestPlaceholders += ["applicationName": "org.telegram.messenger.HuaweiApplicationLoader"]
        }
        direct {
            dimension "distributionType"
            applicationIdSuffix ".web"
            buildConfigField "int", "VERSION_NUM", "6"
            manifestPlaceholders += [
                    "applicationName" : "org.telegram.messenger.direct.ApplicationLoaderImpl",

                    "defaultIcon"     : "@mipmap/ic_launcher_sa",
                    "defaultRoundIcon": "@mipmap/ic_launcher_sa",

                    "vintageIcon"     : "@mipmap/icon_6_launcher_sa",
                    "vintageRoundIcon": "@mipmap/icon_6_launcher_sa",

                    "aquaIcon"        : "@mipmap/icon_4_launcher_sa",
                    "aquaRoundIcon"   : "@mipmap/icon_4_launcher_sa",

                    "premiumIcon"     : "@mipmap/icon_3_launcher_sa",
                    "premiumRoundIcon": "@mipmap/icon_3_launcher_sa",

                    "turboIcon"       : "@mipmap/icon_5_launcher_sa",
                    "turboRoundIcon"  : "@mipmap/icon_5_launcher_sa",

                    "noxIcon"         : "@mipmap/icon_2_launcher_sa",
                    "noxRoundIcon"    : "@mipmap/icon_2_launcher_sa",
            ]
        }
        appTestEnv {
            dimension "distributionType"
            minSdkVersion 26
            testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            manifestPlaceholders += ["applicationName": "org.telegram.messenger.apptestenv.ApplicationLoaderImpl"]
        }
        beta {
            dimension "distributionType"
            applicationIdSuffix ".beta"
            manifestPlaceholders += [
                    "applicationName": "org.telegram.messenger.beta.ApplicationLoaderImpl",
                    "applicationLabel": "@string/AppNameBeta",
            ]
            def publicUrl = getProps("BETA_PUBLIC_URL", false)
            def privateUrl = getProps("BETA_PRIVATE_URL", false)
            def hardcoreUrl = getProps("BETA_HARDCORE_URL", false)
            def activeUrl = publicUrl ?: privateUrl ?: hardcoreUrl
            if (activeUrl) {
                buildConfigField "String", "BETA_URL", "\"${activeUrl}\""
                def appCenterHashKey = publicUrl ? "APP_CENTER_HASH_PUBLIC" : (privateUrl ? "APP_CENTER_HASH_PRIVATE" : "APP_CENTER_HASH_HARDCORE")
                def versionNum = publicUrl ? "4" : (privateUrl ? "1" : "5")
                buildConfigField "String", "APP_CENTER_HASH", "\"" + getProps(appCenterHashKey, false) + "\""
                buildConfigField "int", "VERSION_NUM", versionNum
            }
            gradle.taskGraph.whenReady { taskGraph ->
                if (taskGraph.allTasks.any { it.name.toLowerCase().contains("beta") }) {
                    if ([publicUrl, privateUrl, hardcoreUrl].count { it && !it.isEmpty() } != 1) {
                        throw new GradleException(
                                "Beta build requires EXACTLY ONE URL configuration. " +
                                        "Please check your env/properties and provide a single one of: " +
                                        "BETA_PUBLIC_URL, BETA_PRIVATE_URL, or BETA_HARDCORE_URL."
                        )
                    }
                }
            }
        }
        apk {
            dimension "artifactType"
            versionCode APP_VERSION_CODE.toInteger() * 10 + 9
        }
        bundle {
            dimension "artifactType"
            buildConfigField "boolean", "BUNDLE", "true"
            versionCode APP_VERSION_CODE.toInteger() * 10 + 1
        }
        bundleMinApi23 {
            dimension "artifactType"
            minSdkVersion 23
            buildConfigField "boolean", "BUNDLE", "true"
            versionCode APP_VERSION_CODE.toInteger() * 10 + 2
        }
    }

    signingConfigs {
        debug {
            storeFile file("config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            storeFile file("config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    // forky code end

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro' /* forky comment , '../TMessagesProj/proguard-rules-beta.pro' */
            ndk.debugSymbolLevel = 'FULL'
            /* forky comment
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "0"
            */
            // forky code start
            debuggable true
            signingConfig signingConfigs.debug
            // forky code end
        }

        /* forky comment
        HA_private {
            jniDebuggable false
